name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install semgrep

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=html

      - name: Run Bandit
        run: bandit -r app -f json -o reports/bandit.json -s B311

      - name: Run Semgrep
        run: semgrep scan --config p/python --config p/security-audit app tests --json --output reports/semgrep.json

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks (directory)
        run: gitleaks detect --no-git --no-banner --report-format json --report-path reports/gitleaks-dir.json -s .

      - name: Run Gitleaks (git history)
        run: gitleaks detect --no-banner --report-format json --report-path reports/gitleaks-git.json -s .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy (filesystem)
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format json --output reports/trivy-fs.json .

      - name: Run Trivy (Docker image)
        run: |
          docker build -t secure-streaming-service:ci .
          trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format json --output reports/trivy-image.json secure-streaming-service:ci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
